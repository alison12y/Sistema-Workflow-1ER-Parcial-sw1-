<div class="login-page">
  <section class="info-panel">
    <div class="brand">SISTEMA WORKFLOW</div>

    <div class="info-content">
      <span class="tag">Gestión de procesos empresariales</span>

      <h1>
        1er Parcial de <br />
        Ingenieria de Software 
      </h1>

      <p>
        Diseña, ejecuta y monitorea políticas de negocio mediante workflows,
        formularios dinámicos e indicadores de rendimiento.
      </p>
    </div>
  </section>

  <section class="form-panel">
    <div class="login-card">
      <h2>Bienvenido/a</h2>
      <p class="subtitle">Ingresa para continuar</p>

      <form>
        <label>Correo electrónico</label>
        <input type="email" placeholder="usuario@workflow.com" />

        <label>Contraseña</label>
        <input type="password" placeholder="Ingrese su contraseña" />

        <button type="button" (click)="ingresar()">
        Entrar
        </button>
      </form>

      <p class="support">¿Necesitas acceso? Contacta al administrador</p>
    </div>
  </section>
</div>

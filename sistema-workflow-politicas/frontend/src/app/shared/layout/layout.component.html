<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="logo">◇</span>
      <span class="title">Workflow</span>
    </div>
    <nav class="sidebar-nav">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="main-area">
    <header class="top-header">
      <div class="header-title">
        <h2>Sistema de Políticas</h2>
        <p class="subtitle">Panel de administración</p>
      </div>
      <div class="header-actions">
        @if (user) {
          <span class="user-badge">{{ user.fullName || user.username }}</span>
        }
        <button type="button" class="btn-ghost" (click)="logout()">Cerrar sesión</button>
      </div>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
